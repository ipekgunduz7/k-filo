{% extends "base.html" %}
{% block title %}Upload Data{% endblock %}
{% block page_title %}☁️ Data Upload{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="dash-card text-center p-5">
            <div class="stat-icon icon-blue mx-auto mb-3" style="width: 70px; height: 70px; font-size: 2rem;"><i class="bi bi-file-earmark-arrow-up"></i></div>
            <h4 class="mb-3">Upload Fleet Data</h4>
            <p class="text-muted mb-4">Upload your fuel and vehicle usage data in <strong>.CSV</strong> format.</p>
            
            <form action="/upload" method="POST" enctype="multipart/form-data" class="border border-2 border-dashed border-secondary rounded-3 p-4 bg-light bg-opacity-50">
                <input type="file" name="file" accept=".csv" class="form-control mb-3" required>
                <button type="submit" class="btn btn-primary w-100 rounded-pill"><i class="bi bi-cloud-upload me-2"></i> Upload & Process</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
