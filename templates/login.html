<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>K-FILO Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f7f8fc; font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: white; border-radius: 24px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.05); max-width: 420px; width: 100%; }
        .login-logo { text-align: center; margin-bottom: 30px; }
        .login-logo i { font-size: 2.5rem; color: #5856d6; }
        .login-logo h3 { font-weight: 700; color: #2c3e50; }
        .form-control { border-radius: 12px; padding: 12px 16px; background: #f8f9fa; border: 1px solid #eee; }
        .form-control:focus { background: white; border-color: #5856d6; box-shadow: 0 0 0 0.2rem rgba(88,86,214,0.15); }
        .btn-primary { background: #5856d6; border: none; border-radius: 12px; padding: 12px; font-weight: 600; }
        .btn-primary:hover { background: #4645b5; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <div class="stat-icon icon-purple mx-auto mb-2" style="width: 60px; height: 60px;"><i class="bi bi-grid-fill"></i></div>
            <h3>K-FILO</h3>
            <p class="text-muted small">K-FILO Management Dashboard</p>
        </div>
        {% if error %}<div class="alert alert-danger py-2 small rounded-3">{{ error }}</div>{% endif %}
        <form method="post">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Enter username" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold small">Password</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
    </div>
</body>
</html>
